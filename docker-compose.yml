services:
  postgres:
    image: postgres:15-alpine
    container_name: libratrack-db
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: libratrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - libratrack-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libratrack-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: libratrack
      DB_MAX_OPEN_CONNS: 25
      DB_MAX_IDLE_CONNS: 5
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - libratrack-network

volumes:
  postgres_data:

networks:
  libratrack-network:
